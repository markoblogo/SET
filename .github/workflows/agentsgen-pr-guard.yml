name: SET repo contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install agentsgen==0.5.0 pytest
      # SET maintains a compact custom AGENTS.md and a handwritten RUNBOOK.
      # Validate those with their own contract, not the generator's default template.
      - run: pytest -q tests/test_repo_docs.py
      - run: agentsgen pack . --autodetect --check
