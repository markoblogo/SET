name: SET CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tooling
        run: python3 -m pip install --upgrade pytest
      - name: Run contract tests
        run: pytest -q
      - name: Validate registry
        run: python3 scripts/validate_registry.py
      - name: Run set planning smoke
        run: |
          python3 scripts/plan_config_apply.py markoblogo/SET --format json --repo-root . > /tmp/set-plan.json
      - name: Enforce planning contract
        run: |
          python3 - <<'PY'
          import json
          import sys

          plan = json.load(open('/tmp/set-plan.json'))
          if plan.get('dry_run') is not True:
              raise SystemExit('plan dry_run must be true')
          workflow_check = plan.get('workflow_check', {})
          if workflow_check.get('status') != 'matches':
              raise SystemExit(
                  f"workflow drift check failed: {workflow_check.get('status', 'missing')}"
              )
          print('workflow check ok:', workflow_check.get('status'))
          PY
      - name: Verify installed package
        run: |
          python3 -m pip install build twine
          python3 -m build
          twine check dist/*
          python3 -m venv /tmp/set-wheel
          /tmp/set-wheel/bin/pip install dist/*.whl
          python3 scripts/release_smoke.py --exe /tmp/set-wheel/bin/set-plan-config-apply
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create isolated fixture
        run: |
          mkdir /tmp/set-fixture
          echo '{"name":"example","scripts":{"test":"node --test"}}' > /tmp/set-fixture/package.json
      - uses: ./
        with:
          path: /tmp/set-fixture
          workflow_preset: repo-docs
      - name: Require stale command detection
        run: |
          echo '{"name":"example","scripts":{}}' > /tmp/set-fixture/package.json
          set +e
          agentsgen check /tmp/set-fixture --all --ci
          status=$?
          set -e
          test "$status" -eq 1
