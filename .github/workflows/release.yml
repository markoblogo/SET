name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Run full publish flow"
        default: "false"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test release source
        run: |
          python -m pip install pytest
          pytest -q
          python scripts/validate_registry.py
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == 'v' + version
          PYCODE
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build distributions
        run: python -m build
      - name: Verify installed wheel
        run: |
          python -m pip install twine
          twine check dist/*
          python -m venv /tmp/set-wheel
          /tmp/set-wheel/bin/pip install dist/*.whl
          python scripts/release_smoke.py --exe /tmp/set-wheel/bin/set-plan-config-apply
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    if: |
      github.event_name == 'push' ||
      github.event.inputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Detect PyPI token availability
        id: detect_pypi_token
        shell: bash
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to PyPI (OIDC)
        id: publish_oidc
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
      - name: Publish to PyPI (API token fallback)
        if: steps.publish_oidc.outcome == 'failure' && steps.detect_pypi_token.outputs.has_token == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload --non-interactive dist/*
      - name: Ensure PyPI publish
        if: steps.publish_oidc.outcome == 'failure' && steps.detect_pypi_token.outputs.has_token == 'false'
        run: |
          echo "No trusted publisher and no PYPI_API_TOKEN provided." >&2
          exit 1
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
