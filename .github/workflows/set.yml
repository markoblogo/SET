name: SET

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: markoblogo/SET@v0.5.0
        with:
          agentsgen: "true"
          autodetect: "true"
          path: "."
          workflow_preset: "repo-docs"
          init: "true"
          pack: "true"
          check: "true"
          repomap: "true"
          snippets: "false"
          repomap_compact_budget: "2500"
          repomap_changed: "true"
          proof_loop: "true"
          proof_task_id: "proof-loop-blocked"
          proof_expected_artifacts: "docs/ai/proof/manual-review.md"
