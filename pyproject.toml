[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abvx-set"
version = "0.5.0"
description = "Review-first workflow planning and orchestration contracts for AI-ready repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ABVX" }]
dependencies = []
keywords = ["ai-agents", "github-actions", "orchestration", "repository-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/markoblogo/SET"
Documentation = "https://github.com/markoblogo/SET#readme"
Repository = "https://github.com/markoblogo/SET"
Issues = "https://github.com/markoblogo/SET/issues"
Changelog = "https://github.com/markoblogo/SET/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["scripts"]

[project.scripts]
set-validate-registry = "scripts.validate_registry:main"
set-plan-config-apply = "scripts.plan_config_apply:main"
